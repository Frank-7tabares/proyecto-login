<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a GranCole</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background-color: #f0f4f8;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .future-data-section {
            flex: 1;
            background-color: #fff;
            display: none;
        }

        .login-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            background-color: #e0e8f0;
        }

        .logo img {
            width: 65px; /* Reducido para un ajuste más compacto */
            height: 65px; /* Reducido para un ajuste más compacto */
            margin-bottom: 15px;
            border-radius: 50%;
            background-color: #fff;
            padding: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .welcome-title {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin: 0;
        }

        .welcome-subtitle {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
            margin-bottom: 25px; /* Ajustado para un mejor espaciado */
        }

        .login-form {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            text-align: center;
            padding: 25px; /* Reducido para un ajuste más compacto */
            width: 100%;
            max-width: 400px;
        }

        .form-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin: 0;
            text-align: left;
        }

        .form-subtitle {
            font-size: 14px;
            color: #888;
            margin-top: 5px;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            margin-bottom: 8px;
        }

        .input-container {
            display: flex;
            align-items: center;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            transition: all 0.3s ease;
        }

        .input-container:focus-within {
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.2);
        }

        .input-container .icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }

        .input-container .icon img {
            width: 18px;
            height: 18px;
            filter: brightness(0.5);
        }
        
        .input-container input {
            flex-grow: 1;
            border: none;
            background-color: transparent;
            padding: 0;
            font-size: 16px;
            outline: none;
            color: #333;
        }
        
        .input-container input::placeholder {
            color: #aaa;
        }

        .input-container .validation-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background-color: #e53935;
            border-radius: 4px;
            margin-left: 10px;
        }

        .input-container .validation-icon .line {
            width: 16px;
            height: 2px;
            background-color: #fff;
        }
        
        .input-container .password-toggle {
            cursor: pointer;
            margin-left: 10px;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .input-container .password-toggle img {
            width: 18px;
            height: 18px;
            filter: brightness(0.5);
        }
        
        .forgot-password {
            display: block;
            text-align: right;
            margin-bottom: 25px;
            font-size: 14px;
            color: #007bff;
            text-decoration: none;
            font-weight: 500;
        }

        .login-button {
            width: 100%;
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-button:hover {
            background-color: #0056b3;
        }

        .login-button .arrow-icon {
            font-size: 20px;
            margin-left: 10px;
            line-height: 1;
        }

        .login-footer {
            margin-top: 25px; /* Reducido para un ajuste más compacto */
            font-size: 12px;
            color: #888;
        }

        .login-footer p {
            margin: 0;
            line-height: 1.5;
        }

        .login-footer a {
            color: #007bff;
            text-decoration: none;
            font-weight: 500;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        @media (min-width: 768px) {
            .future-data-section {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="future-data-section"></div>

        <div class="login-section">
            <div class="logo">
                <img src="mi-logo.png.png" alt="Logo de GranCole">
            </div>
            <h1 class="welcome-title">Bienvenido a GranCole</h1>
            <p class="welcome-subtitle">Inicia sesión para continuar</p>

            <div class="login-form">
                <h2 class="form-title">Iniciar Sesión</h2>
                <p class="form-subtitle">Ingresa tus credenciales para acceder al sistema</p>

                <form>
                    <div class="input-group">
                        <label for="usuario">Usuario</label>
                        <div class="input-container">
                            <span class="icon">
                                <img src="https://img.icons8.com/material-outlined/24/000000/user--v1.png" alt="Usuario">
                            </span>
                            <input type="text" id="usuario" placeholder="A 0000000">
                            <span class="validation-icon">
                                <div class="line"></div>
                            </span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="contrasena">Contraseña</label>
                        <div class="input-container">
                            <span class="icon">
                                <img src="https://img.icons8.com/material-outlined/24/000000/lock.png" alt="Contraseña">
                            </span>
                            <input type="password" id="contrasena" placeholder="..."><span class="validation-icon">
                                <div class="line"></div>
                            </span>
                            <span class="password-toggle">
                                <img src="https://img.icons8.com/material-outlined/24/000000/visible--v1.png" alt="Mostrar/Ocultar">
                            </span>
                        </div>
                    </div>

                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>

                    <button type="submit" class="login-button">
                        Iniciar Sesión
                        <span class="arrow-icon">→</span>
                    </button>
                </form>

                <div class="login-footer">
                    <p class="no-account">¿No tienes cuenta? <a href="#">Contacta al administrador</a></p>
                    <p class="copyright">© 2025 GranCole Pro. Todos los derechos reservados.</p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
